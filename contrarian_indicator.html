
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.scr{display:none;}.scr.on{display:block;}
.wrap{max-width:460px;margin:0 auto;padding:1.25rem;}
lbl{font-size:12px;color:var(--color-text-secondary);display:block;margin:12px 0 5px;}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:.875rem;}
.btn{padding:9px 16px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;cursor:pointer;}
.btn:hover{background:var(--color-background-secondary);}
.btn-full{width:100%;padding:11px;font-size:14px;}
.btn-dark{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.btn-dark:hover{background:#333;}
.search-wrap{position:relative;}
.dropdown{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);position:absolute;top:40px;left:0;right:0;z-index:20;max-height:180px;overflow-y:auto;}
.drop-item{padding:9px 12px;font-size:13px;cursor:pointer;color:var(--color-text-primary);}
.drop-item:hover{background:var(--color-background-secondary);}
.drop-item small{color:var(--color-text-secondary);font-size:11px;margin-left:6px;}
.user-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:10px;display:flex;align-items:center;gap:12px;position:relative;}
.user-card.king-card{border:1.5px solid #e8b800;}
.king-badge{position:absolute;top:-11px;left:14px;background:#e8b800;color:#5c4300;font-size:10px;font-weight:500;padding:2px 10px;border-radius:20px;}
.pepe-char{width:60px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0;border:0.5px solid var(--color-border-tertiary);}
.user-info{flex:1;min-width:0;}
.u-name{font-size:14px;font-weight:500;color:var(--color-text-primary);}
.u-ticker{font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
.u-tag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--color-background-secondary);color:var(--color-text-secondary);margin-top:4px;display:inline-block;}
.u-profit{font-size:22px;font-weight:500;text-align:right;white-space:nowrap;}
.profit-up{color:#d0021b;}
.profit-dn{color:#1a6fd4;}
.profit-nu{color:var(--color-text-secondary);}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
.live-dot{width:7px;height:7px;background:#22c55e;border-radius:50%;display:inline-block;margin-right:5px;}
.share-modal-bg{background:rgba(0,0,0,0.4);border-radius:var(--border-radius-lg);padding:1.5rem 1rem;display:flex;align-items:center;justify-content:center;margin-bottom:.875rem;}
.share-modal{background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);padding:1.5rem;width:100%;}
.copy-row{display:flex;gap:6px;margin-top:10px;}
.copy-row input{flex:1;font-size:12px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:8px 10px;color:var(--color-text-secondary);}
.rank-badge{width:20px;height:20px;border-radius:50%;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--color-text-secondary);font-weight:500;flex-shrink:0;}
#s-toast{display:none;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:12px;padding:8px 18px;border-radius:20px;white-space:nowrap;z-index:99;}
</style>

<h2 class="sr-only">인간 지표 — 수익률 공유 채널</h2>

<div id="s-login" class="scr on">
<div class="wrap">
  <div style="text-align:center;padding:1.5rem 0 1.25rem;">
    <div style="font-size:24px;font-weight:500;color:var(--color-text-primary);">인간 지표</div>
    <div style="font-size:13px;color:var(--color-text-secondary);margin-top:6px;">오늘 내 수익률, 솔직하게 공유해봐</div>
  </div>

  <div class="card">
    <lbl>닉네임</lbl>
    <input type="text" id="inp-nick" placeholder="예: 코린이투자자" style="width:100%;">

    <lbl>종목 검색</lbl>
    <div class="search-wrap">
      <input type="text" id="inp-search" placeholder="종목명 또는 티커 검색 (예: 삼성, TSLA, 비트)" style="width:100%;" oninput="doSearch(this.value)" onfocus="doSearch(this.value)" autocomplete="off">
      <div class="dropdown" id="dropdown" style="display:none;"></div>
    </div>
    <div id="selected-ticker" style="margin-top:8px;display:none;">
      <span style="font-size:11px;padding:3px 10px;background:#e8f4e8;color:#1a5c1a;border-radius:20px;font-weight:500;" id="selected-label"></span>
      <span style="font-size:11px;color:var(--color-text-secondary);margin-left:6px;cursor:pointer;" onclick="clearTicker()">✕ 변경</span>
    </div>

    <lbl>평단가</lbl>
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="number" id="inp-avg" placeholder="0.00" style="flex:1;">
      <span style="font-size:13px;color:var(--color-text-secondary);" id="unit-label">USD</span>
    </div>

    <button class="btn btn-full btn-dark" style="margin-top:1rem;" onclick="joinRoom()">입장하기</button>
  </div>
</div>
</div>

<div id="s-room" class="scr">
<div class="wrap">
  <div class="header-row">
    <div>
      <div style="font-size:16px;font-weight:500;color:var(--color-text-primary);">인간 지표</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px;"><span class="live-dot"></span><span id="member-txt">0명 접속 중</span></div>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn" style="font-size:12px;" onclick="showShare()">공유 / 초대</button>
      <button class="btn" style="font-size:12px;" onclick="goBack()">나가기</button>
    </div>
  </div>

  <div id="share-section" style="display:none;">
    <div class="share-modal-bg">
      <div class="share-modal">
        <div style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:.5rem;">친구 초대하기</div>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:.75rem;">링크를 공유하면 같은 채널에 바로 입장해요</div>
        <div class="copy-row">
          <input type="text" readonly id="share-url" value="https://ingan-index.vercel.app/room/abc123">
          <button class="btn" style="font-size:12px;white-space:nowrap;" onclick="copyUrl()">복사</button>
        </div>
        <div style="margin-top:1rem;display:flex;gap:8px;">
          <button class="btn" style="font-size:12px;flex:1;" onclick="fakeShare('카카오톡')">카카오톡</button>
          <button class="btn" style="font-size:12px;flex:1;" onclick="fakeShare('슬랙')">슬랙</button>
          <button class="btn" style="font-size:12px;flex:1;" onclick="fakeShare('링크 복사')">링크 복사</button>
        </div>
        <div style="text-align:right;margin-top:.875rem;">
          <button class="btn" style="font-size:12px;" onclick="hideShare()">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:9px 14px;font-size:12px;color:var(--color-text-secondary);display:flex;justify-content:space-between;margin-bottom:1rem;">
    <span>실시간 업데이트 <span style="color:var(--color-text-tertiary);">(30초 주기)</span></span>
    <span>데모 모드</span>
  </div>

  <div id="user-list"></div>
</div>
</div>

<div id="s-toast"></div>

<script>
const IMGS=[
  "/mnt/user-data/uploads/1775619944787_image.png",
  "/mnt/user-data/uploads/1775619954061_image.png",
  "/mnt/user-data/uploads/1775619958386_image.png",
  "/mnt/user-data/uploads/1775619964168_image.png",
  "/mnt/user-data/uploads/1775620513409_image.png",
  "/mnt/user-data/uploads/1775620559759_image.png"
];

const FROGS=[
  {range:'-60% 이상',min:-Infinity,max:-60},
  {range:'-60%~-20%',min:-60,max:-20},
  {range:'-20%~-10%',min:-20,max:-10},
  {range:'-10%~+10%',min:-10,max:10},
  {range:'+10%~+50%',min:10,max:50},
  {range:'+50% 이상',min:50,max:Infinity},
];

const TICKERS=[
  {sym:'AAPL',name:'Apple',unit:'USD',price:213.5},
  {sym:'TSLA',name:'Tesla',unit:'USD',price:248.5},
  {sym:'NVDA',name:'Nvidia',unit:'USD',price:875.3},
  {sym:'MSFT',name:'Microsoft',unit:'USD',price:415.2},
  {sym:'AMZN',name:'Amazon',unit:'USD',price:198.7},
  {sym:'GOOGL',name:'Google',unit:'USD',price:168.4},
  {sym:'META',name:'Meta',unit:'USD',price:511.3},
  {sym:'BTC-USD',name:'비트코인',unit:'USD',price:82000},
  {sym:'ETH-USD',name:'이더리움',unit:'USD',price:3100},
  {sym:'SOL-USD',name:'솔라나',unit:'USD',price:148},
  {sym:'005930.KS',name:'삼성전자',unit:'KRW',price:78500},
  {sym:'000660.KS',name:'SK하이닉스',unit:'KRW',price:198000},
  {sym:'035420.KS',name:'NAVER',unit:'KRW',price:195000},
  {sym:'051910.KS',name:'LG화학',unit:'KRW',price:312000},
  {sym:'035720.KS',name:'카카오',unit:'KRW',price:41200},
];

let selectedTicker=null;
let users=[
  {nick:'존버왕',sym:'TSLA',name:'Tesla',avg:380,unit:'USD',price:248.5},
  {nick:'떡상기원',sym:'BTC-USD',name:'비트코인',avg:45000,unit:'USD',price:82000},
  {nick:'물타기달인',sym:'005930.KS',name:'삼성전자',avg:85000,unit:'KRW',price:78500},
  {nick:'단타신',sym:'NVDA',name:'Nvidia',avg:820,unit:'USD',price:875.3},
];

function getFrogIdx(p){return FROGS.findIndex(f=>p>=f.min&&p<f.max);}

function doSearch(v){
  const dd=document.getElementById('dropdown');
  if(!v.trim()){dd.style.display='none';return;}
  const q=v.toLowerCase();
  const res=TICKERS.filter(t=>t.sym.toLowerCase().includes(q)||t.name.toLowerCase().includes(q)).slice(0,7);
  if(!res.length){dd.style.display='none';return;}
  dd.innerHTML=res.map(t=>`<div class="drop-item" onclick="selectTicker('${t.sym}')">${t.name}<small>${t.sym}</small><small style="float:right;color:var(--color-text-tertiary);">${t.unit} ${t.price.toLocaleString()}</small></div>`).join('');
  dd.style.display='block';
}

function selectTicker(sym){
  selectedTicker=TICKERS.find(t=>t.sym===sym);
  document.getElementById('inp-search').value=selectedTicker.name+' ('+selectedTicker.sym+')';
  document.getElementById('dropdown').style.display='none';
  document.getElementById('selected-ticker').style.display='block';
  document.getElementById('selected-label').textContent=selectedTicker.sym+' · 현재 '+selectedTicker.price.toLocaleString()+' '+selectedTicker.unit;
  document.getElementById('unit-label').textContent=selectedTicker.unit;
}

function clearTicker(){
  selectedTicker=null;
  document.getElementById('inp-search').value='';
  document.getElementById('selected-ticker').style.display='none';
  document.getElementById('unit-label').textContent='USD';
}

document.addEventListener('click',function(e){
  if(!e.target.closest('.search-wrap'))document.getElementById('dropdown').style.display='none';
});

function calcProfit(avg,price){return((price-avg)/avg)*100;}

function joinRoom(){
  const nick=document.getElementById('inp-nick').value.trim();
  const avg=parseFloat(document.getElementById('inp-avg').value);
  if(!nick){alert('닉네임을 입력해주세요');return;}
  if(!selectedTicker){alert('종목을 검색/선택해주세요');return;}
  if(!avg||avg<=0){alert('평단가를 입력해주세요');return;}
  users=users.filter(u=>u.nick!==nick);
  users.push({nick,sym:selectedTicker.sym,name:selectedTicker.name,avg,unit:selectedTicker.unit,price:selectedTicker.price});
  renderRoom();
  document.getElementById('s-login').classList.remove('on');
  document.getElementById('s-room').classList.add('on');
}

function renderRoom(){
  const sorted=[...users].sort((a,b)=>calcProfit(a.avg,a.price)-calcProfit(b.avg,b.price));
  const loserNick=sorted[0].nick;
  document.getElementById('member-txt').textContent=users.length+'명 접속 중';
  document.getElementById('user-list').innerHTML=sorted.map((u,i)=>{
    const p=calcProfit(u.avg,u.price);
    const idx=getFrogIdx(p);
    const isKing=u.nick===loserNick;
    const cls=p>1?'profit-up':p<-1?'profit-dn':'profit-nu';
    const sign=p>=0?'+':'';
    return`<div class="user-card${isKing?' king-card':''}">
      ${isKing?'<div class="king-badge">👑 최저 수익률</div>':''}
      <div class="rank-badge">${i+1}</div>
      <img class="pepe-char" src="${IMGS[idx]}" alt="pepe">
      <div class="user-info">
        <div class="u-name">${u.nick}</div>
        <div class="u-ticker">${u.name} · 평단 ${u.avg.toLocaleString()} ${u.unit}</div>
        <span class="u-tag">${FROGS[idx].range}</span>
      </div>
      <div class="u-profit ${cls}">${sign}${p.toFixed(1)}%</div>
    </div>`;
  }).join('');
}

function showShare(){document.getElementById('share-section').style.display='block';}
function hideShare(){document.getElementById('share-section').style.display='none';}

function toast(msg){
  const t=document.getElementById('s-toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',1800);
}
function copyUrl(){
  const el=document.getElementById('share-url');
  el.select();try{document.execCommand('copy');}catch(e){}
  toast('링크 복사됨!');
}
function fakeShare(p){toast(p+'으로 공유 준비 완료 (데모)');}
function goBack(){
  document.getElementById('s-room').classList.remove('on');
  document.getElementById('share-section').style.display='none';
  document.getElementById('s-login').classList.add('on');
}
</script>
