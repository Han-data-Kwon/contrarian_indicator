<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인간 지표</title>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f2f7; color: #1a1a1a; min-height: 100vh; }

/* ── Screens ── */
.scr { display: none; min-height: 100vh; }
.scr.on { display: block; }

/* ══════════════════════════════════════
   LOGIN SCREEN
══════════════════════════════════════ */
#s-login { background: #f2f2f7; }

.login-outer {
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 2rem 1rem;
}

/* Mobile first: single column */
.login-inner {
  width: 100%;
  max-width: 440px;
}

/* Desktop: 2-column hero layout */
@media (min-width: 900px) {
  .login-outer {
    align-items: center;
    gap: 0;
    padding: 0;
    background: linear-gradient(135deg, #1a1a1a 50%, #f2f2f7 50%);
  }
  .login-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 900px;
    min-height: 100vh;
    align-items: center;
    gap: 0;
  }
  .login-hero {
    padding: 3rem;
    color: #fff;
  }
  .login-form-col {
    padding: 3rem 2.5rem;
    background: #f2f2f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
}

.login-hero { padding: 0 0 1.5rem; }
.logo-title { font-size: clamp(28px, 5vw, 42px); font-weight: 800; letter-spacing: -1px; }
.logo-sub { font-size: clamp(13px, 2vw, 16px); color: #888; margin-top: 6px; }
@media (min-width: 900px) { .logo-sub { color: rgba(255,255,255,.6); } }

.card { background: #fff; border-radius: 18px; padding: clamp(1.25rem, 3vw, 1.75rem); margin-bottom: .875rem; box-shadow: 0 2px 8px rgba(0,0,0,.07); }

.field-label { font-size: 12px; font-weight: 700; color: #666; margin-bottom: 6px; margin-top: 14px; display: block; text-transform: uppercase; letter-spacing: .5px; }
.field-label:first-child { margin-top: 0; }

input[type=text], input[type=number] {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid #e0e0e0; border-radius: 12px;
  font-size: 14px; outline: none; transition: border .15s;
  background: #fafafa;
}
input:focus { border-color: #1a1a1a; background: #fff; }

.search-wrap { position: relative; }
.dropdown {
  background: #fff; border: 1.5px solid #e0e0e0;
  border-radius: 14px; position: absolute; top: 46px; left: 0; right: 0;
  z-index: 30; max-height: 220px; overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
}
.drop-item { padding: 11px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f5f5f5; display: flex; align-items: center; gap: 6px; }
.drop-item:last-child { border-bottom: none; }
.drop-item:hover { background: #f9f9f9; }
.drop-sym { color: #aaa; font-size: 11px; }
.drop-price { margin-left: auto; color: #bbb; font-size: 11px; }

.selected-pill { display: inline-flex; align-items: center; gap: 6px; background: #e8f5e9; color: #2e7d32; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; margin-top: 8px; }
.selected-pill .x { cursor: pointer; color: #888; font-size: 15px; line-height: 1; }

.unit-row { display: flex; gap: 8px; align-items: center; }
.unit-row input { flex: 1; }
.unit-label { font-size: 14px; color: #888; font-weight: 700; min-width: 40px; }

.btn-primary {
  width: 100%; padding: 14px;
  background: #1a1a1a; color: #fff;
  border: none; border-radius: 14px;
  font-size: 15px; font-weight: 700;
  cursor: pointer; margin-top: 1.25rem;
  transition: opacity .15s, transform .1s;
}
.btn-primary:hover { opacity: .88; }
.btn-primary:active { transform: scale(.98); }

.btn-sm {
  padding: 8px 14px; background: #fff;
  border: 1.5px solid #ddd; border-radius: 10px;
  font-size: 13px; cursor: pointer; transition: background .15s;
  white-space: nowrap;
}
.btn-sm:hover { background: #f5f5f5; }

/* ══════════════════════════════════════
   ROOM SCREEN
══════════════════════════════════════ */
#s-room { background: #f2f2f7; }

/* Mobile: single column */
.room-layout {
  max-width: 560px;
  margin: 0 auto;
  padding: 1.25rem 1rem;
}

/* Tablet: slightly wider */
@media (min-width: 600px) {
  .room-layout { padding: 1.5rem; }
}

/* Desktop: 3-column layout */
@media (min-width: 1024px) {
  #s-room { padding: 2rem; }
  .room-layout {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0;
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    grid-template-rows: auto 1fr;
    gap: 1.25rem;
    align-items: start;
  }
  .room-header-area { grid-column: 1 / -1; }
  .room-left-col { grid-column: 1; grid-row: 2; }
  .room-main-col { grid-column: 2; grid-row: 2; }
  .room-right-col { grid-column: 3; grid-row: 2; position: sticky; top: 2rem; }
}

.room-header {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 1rem;
}
@media (min-width: 1024px) { .room-header { margin-bottom: 0; } }

.room-title { font-size: clamp(18px, 3vw, 22px); font-weight: 800; letter-spacing: -.5px; }
.room-sub { font-size: 12px; color: #888; margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dot-live { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.header-btns { display: flex; gap: 6px; flex-shrink: 0; }

/* Info panel (left col on desktop) */
.info-panel {
  background: #fff; border-radius: 14px; padding: 1rem 1.25rem;
  box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 1rem;
}
@media (min-width: 1024px) { .info-panel { margin-bottom: 0; } }

.info-panel-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
.info-panel-row:last-child { border-bottom: none; }
.info-panel-label { color: #888; }
.info-panel-val { font-weight: 600; }

/* Stats (left col on desktop) */
.stats-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: .75rem; margin-bottom: 1rem;
}
@media (min-width: 1024px) { .stats-grid { margin-bottom: .875rem; } }

.stat-card { background: #fff; border-radius: 14px; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.stat-label { font-size: 11px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.stat-val { font-size: 22px; font-weight: 800; margin-top: 4px; }
.stat-val.red { color: #e53935; }
.stat-val.blue { color: #1976d2; }
.stat-val.green { color: #2e7d32; }

/* Filter tabs */
.filter-tabs { display: flex; gap: 6px; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 2px; }
.filter-tab {
  padding: 7px 16px; border-radius: 20px; font-size: 12px;
  font-weight: 700; cursor: pointer; white-space: nowrap;
  border: 1.5px solid #e0e0e0; background: #fff; color: #666;
  transition: all .15s;
}
.filter-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

/* User cards */
.user-card {
  background: #fff; border-radius: 16px; padding: 1rem 1.25rem;
  margin-bottom: 10px; display: flex; align-items: center;
  gap: 12px; position: relative;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  transition: transform .1s;
}
.user-card:hover { transform: translateY(-1px); }
.user-card.king { border: 2px solid #f5c842; }
.king-badge {
  position: absolute; top: -12px; left: 14px;
  background: #f5c842; color: #5c4300;
  font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 20px;
}

.pepe-img { width: clamp(48px, 8vw, 64px); height: clamp(48px, 8vw, 64px); border-radius: 12px; object-fit: cover; flex-shrink: 0; border: 1px solid #eee; }
.user-info { flex: 1; min-width: 0; }
.u-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-ticker { font-size: 11px; color: #999; margin-top: 2px; }
.u-tags { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
.u-range { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: #f0f0f0; color: #666; font-weight: 600; }
.u-profit { font-size: clamp(18px, 3vw, 22px); font-weight: 800; text-align: right; white-space: nowrap; }
.profit-up { color: #e53935; }
.profit-dn { color: #1976d2; }
.profit-nu { color: #888; }
.rank-no { width: 24px; height: 24px; border-radius: 50%; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #999; flex-shrink: 0; }

.loc-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #e3f2fd; color: #1565c0; font-weight: 600; white-space: nowrap; }
.loc-badge.near { background: #e8f5e9; color: #2e7d32; }

/* Chat (right col on desktop) */
.chat-section { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-top: 1rem; }
@media (min-width: 1024px) { .chat-section { margin-top: 0; } }

.chat-head { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.chat-msgs { height: clamp(160px, 25vh, 380px); overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
@media (min-width: 1024px) { .chat-msgs { height: 420px; } }

.chat-msg { display: flex; gap: 6px; align-items: flex-end; }
.chat-msg.mine { flex-direction: row-reverse; }
.chat-nick { font-size: 10px; color: #bbb; flex-shrink: 0; margin-bottom: 2px; }
.chat-bubble { max-width: 72%; padding: 8px 12px; border-radius: 16px; font-size: 13px; line-height: 1.4; }
.chat-msg:not(.mine) .chat-bubble { background: #f0f0f0; color: #1a1a1a; border-bottom-left-radius: 4px; }
.chat-msg.mine .chat-bubble { background: #1a1a1a; color: #fff; border-bottom-right-radius: 4px; }
.chat-input-row { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #f5f5f5; }
.chat-input-row input { flex: 1; padding: 9px 14px; border: 1.5px solid #e0e0e0; border-radius: 24px; font-size: 13px; outline: none; }
.chat-input-row input:focus { border-color: #1a1a1a; }
.chat-send { padding: 9px 18px; background: #1a1a1a; color: #fff; border: none; border-radius: 24px; font-size: 13px; font-weight: 600; cursor: pointer; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 22px; padding: 1.75rem; width: 100%; max-width: 380px; }
.modal h2 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
.modal p { font-size: 13px; color: #888; margin-bottom: 1rem; }
.copy-row { display: flex; gap: 8px; }
.copy-row input { flex: 1; font-size: 12px; background: #f5f5f5; border: none; border-radius: 10px; padding: 10px 12px; color: #666; outline: none; }
.share-btns { display: flex; gap: 8px; margin-top: 1rem; }
.share-btns button { flex: 1; padding: 11px; border: 1.5px solid #ddd; background: #fff; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.share-btns button:hover { background: #f5f5f5; }
.modal-close { text-align: right; margin-top: 1rem; }

/* Toast */
#toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 600; padding: 10px 22px; border-radius: 28px; display: none; z-index: 200; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.2); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
</style>
</head>
<body>

<!-- ════════════════════════
     LOGIN SCREEN
════════════════════════ -->
<div id="s-login" class="scr on">
  <div class="login-outer">
    <div class="login-inner">

      <!-- Hero (left on desktop, top on mobile) -->
      <div class="login-hero">
        <div class="logo-title">인간 지표</div>
        <div class="logo-sub">오늘 내 수익률, 솔직하게 공유해봐</div>
      </div>

      <!-- Form (right on desktop, below on mobile) -->
      <div class="login-form-col">
        <div class="card">
          <span class="field-label">닉네임</span>
          <input type="text" id="inp-nick" placeholder="예: 코린이투자자" maxlength="12">

          <span class="field-label">종목 검색</span>
          <div class="search-wrap">
            <input type="text" id="inp-search" placeholder="종목명 또는 티커 (예: 삼성, TSLA, 비트)" oninput="doSearch(this.value)" onfocus="doSearch(this.value)" autocomplete="off">
            <div class="dropdown" id="dropdown" style="display:none;"></div>
          </div>
          <div id="selected-ticker" style="display:none; margin-top:8px;">
            <div class="selected-pill">
              <span id="selected-label"></span>
              <span class="x" onclick="clearTicker()">✕</span>
            </div>
          </div>

          <span class="field-label">평단가</span>
          <div class="unit-row">
            <input type="number" id="inp-avg" placeholder="0.00" min="0">
            <span class="unit-label" id="unit-label">USD</span>
          </div>

          <button class="btn-primary" onclick="joinRoom()">입장하기 →</button>
        </div>
        <div style="text-align:center; font-size:11px; color:#bbb; margin-top:.5rem;">
          입장하면 수익률에 따라 나의 캐릭터가 결정됩니다
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ════════════════════════
     ROOM SCREEN
════════════════════════ -->
<div id="s-room" class="scr">
  <div class="room-layout">

    <!-- Header (full width) -->
    <div class="room-header-area">
      <div class="room-header">
        <div>
          <div class="room-title">인간 지표</div>
          <div class="room-sub">
            <span class="dot-live"></span>
            <span id="member-txt">0명 접속 중</span>
            <span class="loc-badge" id="loc-badge" style="display:none;">📍 위치 인식 중</span>
          </div>
        </div>
        <div class="header-btns">
          <button class="btn-sm" onclick="openShare()">공유 / 초대</button>
          <button class="btn-sm" onclick="goBack()">나가기</button>
        </div>
      </div>
    </div>

    <!-- Left col (desktop) / above list (mobile) -->
    <div class="room-left-col">
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">최고 수익</div>
          <div class="stat-val green" id="stat-best">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">최대 손실</div>
          <div class="stat-val red" id="stat-worst">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">평균 수익률</div>
          <div class="stat-val blue" id="stat-avg">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">수익 중</div>
          <div class="stat-val" id="stat-win">-</div>
        </div>
      </div>

      <!-- Info -->
      <div class="info-panel">
        <div class="info-panel-row">
          <span class="info-panel-label">업데이트</span>
          <span class="info-panel-val" id="last-update-txt">방금 전</span>
        </div>
        <div class="info-panel-row">
          <span class="info-panel-label">데이터</span>
          <span class="info-panel-val">Yahoo Finance</span>
        </div>
        <div class="info-panel-row">
          <span class="info-panel-label">채널 ID</span>
          <span class="info-panel-val">#abc123</span>
        </div>
      </div>
    </div>

    <!-- Main col: filter + user list -->
    <div class="room-main-col">
      <div class="filter-tabs">
        <div class="filter-tab active" onclick="setFilter('all',this)">전체</div>
        <div class="filter-tab" onclick="setFilter('near',this)">📍 근처만</div>
        <div class="filter-tab" onclick="setFilter('loss',this)">손실만</div>
        <div class="filter-tab" onclick="setFilter('profit',this)">수익만</div>
      </div>
      <div id="user-list"></div>
    </div>

    <!-- Right col: chat -->
    <div class="room-right-col">
      <div class="chat-section">
        <div class="chat-head">💬 채널 채팅 <span style="font-size:11px;font-weight:400;color:#bbb;margin-left:4px;">실시간</span></div>
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-inp" placeholder="메시지 입력..." maxlength="100" onkeydown="if(event.key==='Enter')sendChat()">
          <button class="chat-send" onclick="sendChat()">전송</button>
        </div>
      </div>
    </div>

  </div>
  <div style="text-align:center;font-size:11px;color:#bbb;padding:1.5rem;margin-top:.5rem;">
    데모 모드 · 실서비스는 Yahoo Finance API + Supabase Realtime 연동 예정
  </div>
</div>

<!-- Share Modal -->
<div class="modal-overlay" id="share-modal">
  <div class="modal">
    <h2>친구 초대하기</h2>
    <p>링크를 공유하면 같은 채널에 바로 입장해요</p>
    <div class="copy-row">
      <input type="text" readonly id="share-url" value="https://ingan-index.vercel.app/room/abc123">
      <button class="btn-sm" onclick="copyUrl()">복사</button>
    </div>
    <div class="share-btns">
      <button onclick="fakeShare('카카오톡')">카카오톡</button>
      <button onclick="fakeShare('슬랙')">슬랙</button>
      <button onclick="fakeShare('링크 복사')">링크</button>
    </div>
    <div class="modal-close"><button class="btn-sm" onclick="closeShare()">닫기</button></div>
  </div>
</div>

  {nick:'떡상기원',  msg:'비트 언제 오릅니까 진짜', mine:false},
  {nick:'물타기달인', msg:'삼성 진짜 ㅠㅠ 물타기 계속', mine:false},
];

function getFrogIdx(p) { return FROGS.findIndex(f => p >= f.min && p < f.max); }
function calcProfit(avg, price) { return ((price - avg) / avg) * 100; }

function doSearch(v) {
  const dd = document.getElementById('dropdown');
  if (!v.trim()) { dd.style.display = 'none'; return; }
  const q = v.toLowerCase();
  const res = TICKERS.filter(t => t.sym.toLowerCase().includes(q) || t.name.toLowerCase().includes(q)).slice(0, 8);
  if (!res.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = res.map(t =>
    `<div class="drop-item" onclick="selectTicker('${t.sym}')">
      ${t.name}<span class="drop-sym">${t.sym}</span>
      <span class="drop-price">${t.unit} ${t.price.toLocaleString()}</span>
    </div>`
  ).join('');
  dd.style.display = 'block';
}

function selectTicker(sym) {
  selectedTicker = TICKERS.find(t => t.sym === sym);
  document.getElementById('inp-search').value = selectedTicker.name + ' (' + selectedTicker.sym + ')';
  document.getElementById('dropdown').style.display = 'none';
  document.getElementById('selected-ticker').style.display = 'block';
  document.getElementById('selected-label').textContent = selectedTicker.sym + ' · 현재가 ' + selectedTicker.price.toLocaleString() + ' ' + selectedTicker.unit;
  document.getElementById('unit-label').textContent = selectedTicker.unit;
}

function clearTicker() {
  selectedTicker = null;
  document.getElementById('inp-search').value = '';
  document.getElementById('selected-ticker').style.display = 'none';
  document.getElementById('unit-label').textContent = 'USD';
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-wrap')) document.getElementById('dropdown').style.display = 'none';
});

function joinRoom() {
  const nick = document.getElementById('inp-nick').value.trim();
  const avg  = parseFloat(document.getElementById('inp-avg').value);
  if (!nick)           { alert('닉네임을 입력해주세요'); return; }
  if (!selectedTicker) { alert('종목을 검색/선택해주세요'); return; }
  if (!avg || avg <= 0){ alert('평단가를 입력해주세요'); return; }

  myNick = nick;
  users = users.filter(u => u.nick !== nick);
  const locIdx = Math.floor(Math.random() * DEMO_LOCS.length);
  users.push({
    nick, sym: selectedTicker.sym, name: selectedTicker.name,
    avg, unit: selectedTicker.unit, price: selectedTicker.price,
    loc: DEMO_LOCS[locIdx], dist: parseFloat((Math.random() * 5).toFixed(1)), isMe: true
  });

  tryGetLocation();
  renderRoom();
  renderChat();

  document.getElementById('s-login').classList.remove('on');
  document.getElementById('s-room').classList.add('on');
}

function tryGetLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    () => {
      const el = document.getElementById('loc-badge');
      el.textContent = '📍 위치 인식됨';
      el.style.display = 'inline-block';
      el.className = 'loc-badge near';
    },
    () => {
      const el = document.getElementById('loc-badge');
      el.textContent = '📍 위치 미허용 (데모)';
      el.style.display = 'inline-block';
    }
  );
}

function setFilter(type, el) {
  currentFilter = type;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderRoom();
}

function getFilteredUsers() {
  const sorted = [...users].sort((a, b) => calcProfit(a.avg, a.price) - calcProfit(b.avg, b.price));
  if (currentFilter === 'near')   return sorted.filter(u => u.dist !== undefined && u.dist <= 5);
  if (currentFilter === 'loss')   return sorted.filter(u => calcProfit(u.avg, u.price) < -1);
  if (currentFilter === 'profit') return sorted.filter(u => calcProfit(u.avg, u.price) > 1);
  return sorted;
}

function renderStats() {
  const profits = users.map(u => calcProfit(u.avg, u.price));
  const best    = Math.max(...profits);
  const worst   = Math.min(...profits);
  const avg     = profits.reduce((a,b) => a+b, 0) / profits.length;
  const wins    = profits.filter(p => p > 0).length;

  document.getElementById('stat-best').textContent  = (best >= 0 ? '+' : '') + best.toFixed(1) + '%';
  document.getElementById('stat-worst').textContent = worst.toFixed(1) + '%';
  document.getElementById('stat-avg').textContent   = (avg >= 0 ? '+' : '') + avg.toFixed(1) + '%';
  document.getElementById('stat-win').textContent   = wins + ' / ' + users.length;
}

function renderRoom() {
  const allSorted  = [...users].sort((a, b) => calcProfit(a.avg, a.price) - calcProfit(b.avg, b.price));
  const loserNick  = allSorted[0].nick;
  const filtered   = getFilteredUsers();

  document.getElementById('member-txt').textContent = users.length + '명 접속 중';
  renderStats();

  const html = filtered.map((u, i) => {
    const p      = calcProfit(u.avg, u.price);
    const idx    = getFrogIdx(p);
    const isKing = u.nick === loserNick;
    const cls    = p > 1 ? 'profit-up' : p < -1 ? 'profit-dn' : 'profit-nu';
    const sign   = p >= 0 ? '+' : '';
    const distStr = u.dist !== undefined
      ? `<span class="loc-badge ${u.dist <= 5 ? 'near' : ''}">${u.dist <= 5 ? '근처 ' : ''}${u.dist}km</span>`
      : '';

    return `<div class="user-card ${isKing ? 'king' : ''}">
      ${isKing ? '<div class="king-badge">👑 최저 수익률</div>' : ''}
      <div class="rank-no">${i + 1}</div>
      <img class="pepe-img" src="${PEPE_IMGS[idx]}" alt="pepe">
      <div class="user-info">
        <div class="u-name">${u.nick}${u.isMe ? ' <span style="font-size:10px;color:#bbb;font-weight:400;">(나)</span>' : ''}</div>
        <div class="u-ticker">${u.name} · 평단 ${u.avg.toLocaleString()} ${u.unit}</div>
        <div class="u-tags">
          <span class="u-range">${FROGS[idx].range}</span>
          ${distStr}
        </div>
      </div>
      <div class="u-profit ${cls}">${sign}${p.toFixed(1)}%</div>
    </div>`;
  }).join('');

  document.getElementById('user-list').innerHTML = html ||
    '<div style="text-align:center;color:#bbb;padding:2.5rem;font-size:13px;">해당하는 유저가 없어요</div>';
}

function renderChat() {
  const el = document.getElementById('chat-msgs');
  el.innerHTML = chatLog.map(m => `
    <div class="chat-msg ${m.mine ? 'mine' : ''}">
      ${!m.mine ? `<span class="chat-nick">${m.nick}</span>` : ''}
      <div class="chat-bubble">${m.msg}</div>
      ${m.mine ? '<span class="chat-nick">나</span>' : ''}
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function sendChat() {
  const inp = document.getElementById('chat-inp');
  const msg = inp.value.trim();
  if (!msg) return;
  chatLog.push({nick: myNick, msg, mine: true});
  inp.value = '';
  renderChat();
  setTimeout(() => {
    const res = ['ㅋㅋㅋㅋ', '진짜요?', '저도 ㅠㅠ', '화이팅!', '오늘 장 어때요?', '존버해야죠', '손절 각인데...'];
    const others = users.filter(u => !u.isMe);
    if (others.length) {
      const sender = others[Math.floor(Math.random() * others.length)];
      chatLog.push({nick: sender.nick, msg: res[Math.floor(Math.random() * res.length)], mine: false});
      renderChat();
    }
  }, 600 + Math.random() * 1000);
}

function openShare()  { document.getElementById('share-modal').classList.add('open'); }
function closeShare() { document.getElementById('share-modal').classList.remove('open'); }

function copyUrl() {
  const el = document.getElementById('share-url');
  el.select();
  try { document.execCommand('copy'); } catch(e) {}
  toast('링크 복사됨!');
}

function fakeShare(p) { closeShare(); toast(p + '으로 공유 준비 완료 (데모)'); }

function goBack() {
  document.getElementById('s-room').classList.remove('on');
  document.getElementById('s-login').classList.add('on');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1800);
}

document.getElementById('share-modal').addEventListener('click', function(e) {
  if (e.target === this) closeShare();
});
</script>
</body>
</html>
